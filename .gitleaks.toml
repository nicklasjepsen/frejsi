# gitleaks runs in ci.yml on every PR and push to main (docs/superpowers/plans §8).
title = "frejsi"

[extend]
useDefault = true

# No path is exempt: a real credential in .env.example, a fixture or a design export must fail
# the scan. Only the placeholder shapes themselves are allowed.
[allowlist]
description = "Placeholder values"
regexes = [
  '''<[a-z0-9-]+>''',
  '''password=<local-sa-password>''',
]
