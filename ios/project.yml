# XcodeGen definition for the Nænsom iPhone app (plan docs/superpowers/plans/2026-11-08-ios-follower-app.md §2).
# The .xcodeproj, the Info.plists and the entitlements files are generated from this file and are not
# committed: run `xcodegen generate` in ios/ (README.md).
name: Naensom
options:
  bundleIdPrefix: ninja.jepsen
  deploymentTarget:
    iOS: "17.2" # push-to-start for Live Activities (Activity.pushToStartTokenUpdates) needs 17.2
  createIntermediateGroups: true
  developmentLanguage: da
settings:
  base:
    DEVELOPMENT_TEAM: B32HGH682W
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0" # the language mode (Swift 5), not the compiler release
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  FollowCore:
    path: Packages/FollowCore
targets:
  Naensom:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FollowCore
      - target: NaensomLiveActivity
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nænsom
        CFBundleDevelopmentRegion: da
        CFBundleLocalizations: [da, en]
        NSSupportsLiveActivities: true
        # One reading every five minutes is 288 updates a day; this asks iOS for the larger budget.
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Naensom.entitlements
      properties:
        # Xcode's App Store export switches this to production; the push-test CLI picks the host.
        aps-environment: development
        com.apple.security.application-groups:
          - group.ninja.jepsen.naensom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ninja.jepsen.naensom
        PRODUCT_NAME: Naensom
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  NaensomLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    dependencies:
      - package: FollowCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Nænsom
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LiveActivity/NaensomLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ninja.jepsen.naensom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ninja.jepsen.naensom.liveactivity
        PRODUCT_NAME: NaensomLiveActivity
        SKIP_INSTALL: YES
schemes:
  Naensom:
    build:
      targets:
        Naensom: all
        NaensomLiveActivity: all
    run:
      config: Debug
    test:
      config: Debug
