name: ci

# The fast suite, and the only required check on main (docs/agent-workflow.md §4).
# Secrets scan, typecheck, lint, unit tests, the Prisma schema-vs-migration check and the
# dosing-vocabulary test on the affected packages; AI evals only when prompts or evals change.
# No deploy, no database, no browser, no Azure login. Target 5 minutes, hard stop at 10.
# Anything slower belongs in release.yml.
#
# The same job runs on every push to main as a tripwire: merging deploys nothing, and nothing is
# serialized, so lanes never queue behind each other.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholder so `prisma validate` and `prisma migrate diff` can load the schema; nothing connects.
      DATABASE_URL: "sqlserver://localhost:1433;database=frejsi;user=sa;password=placeholder;encrypt=true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No secrets in the repo (CLAUDE.md). Uses the repo's .gitleaks.toml; seconds.
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Classify the change
        id: changes
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then BASE=$(git rev-parse HEAD~1 2>/dev/null || echo ""); fi
          CHANGED=""
          if [ -n "$BASE" ]; then CHANGED=$(git diff --name-only "$BASE" HEAD); fi
          # A change outside the packages (root config, lock file, workflows) runs everything.
          if [ -z "$BASE" ] || echo "$CHANGED" | grep -Evq '^(web|poller|shared)/'; then
            echo "filter=" >> "$GITHUB_OUTPUT"
          else
            echo "filter=--filter ...[$BASE]" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -Eq '^(evals/|web/src/ai/|shared/src/ai/)'; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi
          # Docs only (Markdown anywhere, or anything under docs/): nothing builds or deploys from
          # these, so the code checks are skipped. The secrets scan, the docs declaration and the
          # docs checker still run, and this job still reports, as the required check.
          if [ -n "$BASE" ] && [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -Evq '(\.md$|^docs/)'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: PR docs declaration
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node scripts/check-docs.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      # Affected packages only: `...[<base>]` selects packages changed since the base and their
      # dependents. With no usable base, or a change outside the packages, everything runs.
      - name: Typecheck, lint, unit tests
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          pnpm -r ${{ steps.changes.outputs.filter }} typecheck
          pnpm -r ${{ steps.changes.outputs.filter }} lint
          pnpm -r ${{ steps.changes.outputs.filter }} test

      - name: Docs checker tests
        run: pnpm test:scripts

      # The schema and the committed migration must agree; no database involved (plan task 1).
      - name: Prisma schema matches the migration
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm --filter ./shared prisma:check

      # The guardrail the spec names: a test asserts dosing vocabulary is absent from UI strings
      # and schema keys. It runs on every change, affected or not; it is seconds.
      # pnpm forwards a bare `--` to vitest, which then ignores the pattern; pass the flags directly.
      - name: Dosing vocabulary test
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm --filter ./shared test --run --testNamePattern "dosing"

      - name: AI evals (prompts or evals changed)
        if: steps.changes.outputs.evals == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EVALS }}
        run: pnpm --filter ./evals test
