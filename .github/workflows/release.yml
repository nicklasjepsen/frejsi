name: release
# The tag in every run's title, for pushes and redeploys alike: the verify job reads it back to find
# the tag whose infrastructure was last applied.
run-name: release ${{ github.event.inputs.tag || github.ref_name }}

# The only path to production (docs/agent-workflow.md section 6). Runs on a pushed `vX.Y.Z` tag whose
# title is a milestone with zero open issues, and on workflow_dispatch with an existing tag to redeploy
# it (rollback). Verify → full suite → infra (owner approval only when infra changed; the Bicep diff in
# the PR is the review, the approval is the gate, no what-if) → deploy → smoke → GitHub release →
# milestone closed. A failed run creates no release; fix forward with the next patch.
#
# Azure access: OIDC federated credentials on the environments `production-infra` and `production`,
# repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and the optional
# CUSTOM_DOMAIN and SQL_SERVER_ID, and the repository secret ALERT_EMAIL (a secret, so the address
# stays out of this public repository's run logs) (infra/README.md, "What the owner does once"). The
# infra job deploys infra/main.bicep with infra/main.bicepparam; the deploy job calls infra/deploy.sh.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to redeploy (rollback)
        required: true
      infra:
        description: Also run the infra job (after changing a repository variable such as CUSTOM_DOMAIN; the Bicep files need not have changed)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write
  actions: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # A fork may name its resource group; production keeps `frejsi` (infra/README.md).
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'frejsi' }}
  SQLCMD_VERSION: v1.8.2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      milestone_number: ${{ steps.ms.outputs.number }}
      infra_changed: ${{ steps.infra.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Tag is a milestone with no open issues
        id: ms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MS=$(gh api "repos/${{ github.repository }}/milestones?state=all&per_page=100" --jq ".[] | select(.title==\"$TAG\")")
          if [ -z "$MS" ]; then echo "::error::No milestone titled $TAG. A release is a milestone."; exit 1; fi
          OPEN=$(echo "$MS" | jq -r .open_issues)
          if [ "$OPEN" != "0" ] && [ -z "${{ github.event.inputs.tag }}" ]; then
            echo "::error::Milestone $TAG still has $OPEN open issue(s)."; exit 1
          fi
          echo "number=$(echo "$MS" | jq -r .number)" >> "$GITHUB_OUTPUT"

      - name: Did infra change since the infra last applied?
        id: infra
        # Also true when a redeploy asks for it: the parameters come from repository variables, which
        # a file diff cannot see (README step 7, the custom domain).
        # The baseline is the newest other tag whose infra job succeeded, read from this workflow's
        # runs; not the previous tag or release. A failed release keeps its tag but may have applied
        # nothing (v0.1.0 failed in its suite, before infra), and a run that applied infra and failed
        # later changed production without publishing. Runs that skipped infra changed nothing and
        # are passed over. No baseline, or one that is not a tag here, means infra runs.
        # Only the Bicep files count: infra/README.md and infra/test/ change nothing in Azure, and
        # deploy.sh runs in the deploy job on every release anyway. A docs edit under infra/ must
        # not ask the owner for a tap.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --repo "${{ github.repository }}" --workflow release.yml --limit 100 \
            --json databaseId,displayTitle --jq '.[] | "\(.databaseId) \(.displayTitle)"')
          PREV=""
          while read -r id title; do
            tag="${title#release }"
            if [ -z "$id" ] || [ "$tag" = "$TAG" ]; then continue; fi
            infra=$(gh run view "$id" --repo "${{ github.repository }}" --json jobs \
              --jq '[.jobs[] | select(.name == "infra") | .conclusion][0] // ""')
            if [ "$infra" = "success" ]; then PREV="$tag"; break; fi
          done <<< "$RUNS"
          if [ -n "$PREV" ] && ! git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then PREV=""; fi
          echo "Infra last applied from: ${PREV:-nothing}"
          if [ "${{ github.event.inputs.infra }}" = "true" ] || [ -z "$PREV" ] || git diff --name-only "$PREV" "$TAG" -- infra/ | grep -Eq '\.bicep(param)?$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  full-suite:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # The Prisma integration tests and the Playwright run (its globalSetup migrates and seeds).
      DATABASE_URL: sqlserver://localhost:1433;database=frejsi_test;user=sa;password=${{ secrets.CI_SQL_SA_PASSWORD }};encrypt=true;trustServerCertificate=true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit, typecheck, lint
        run: pnpm -r typecheck && pnpm -r lint && pnpm -r test
      - name: Prisma integration tests
        run: pnpm --filter ./shared test:integration
      - name: AI evals (full release corpus; live only with the dedicated key)
        env:
          EVALS_SCOPE: release
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EVALS }}
        run: pnpm --filter ./evals test
      - name: Production build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.TAG }}
        run: pnpm -r build
      - name: Playwright (simpleMode flows)
        env:
          FAKE_GLUCOSE_SOURCE: '1'
          FAKE_AI_PROVIDER: '1'
        run: pnpm --filter ./web test:e2e
      # The standalone Next.js build and the poller bundle; `.next` is a hidden directory.
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ env.TAG }}
          include-hidden-files: true
          path: |
            web/.next
            poller/dist
          retention-days: 30

  infra:
    needs: [verify, full-suite]
    if: needs.verify.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer on this environment = the owner. One tap, only when infra changed.
    environment: production-infra
    env:
      # Read by infra/main.bicepparam through readEnvironmentVariable(); never committed.
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      SQL_SERVER_ID: ${{ vars.SQL_SERVER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Repository variables are set
        run: |
          test -n "${{ vars.AZURE_CLIENT_ID }}" || { echo "::error::repository variable AZURE_CLIENT_ID is not set (infra/README.md)"; exit 1; }
          test -n "${{ vars.AZURE_TENANT_ID }}" || { echo "::error::repository variable AZURE_TENANT_ID is not set (infra/README.md)"; exit 1; }
          test -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" || { echo "::error::repository variable AZURE_SUBSCRIPTION_ID is not set (infra/README.md)"; exit 1; }
          test -n "$ALERT_EMAIL" || { echo "::error::repository secret ALERT_EMAIL is not set; the 35-minute alert needs an address (infra/README.md)"; exit 1; }
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infra/main.bicep
        # Two attempts: on the very first deployment the Key Vault role assignment the bootstrap-token
        # secret depends on can take a minute to propagate; the deployment is idempotent.
        run: |
          for attempt in 1 2; do
            if az deployment group create --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" -g "$AZURE_RESOURCE_GROUP" \
                 -f infra/main.bicep -p infra/main.bicepparam -n "release-$TAG-$attempt" --output none; then
              exit 0
            fi
            echo "::warning::deployment attempt $attempt failed"
            sleep 60
          done
          exit 1

  deploy:
    needs: [verify, full-suite, infra]
    # Run when infra succeeded or was skipped (unchanged); never when it failed.
    if: always() && needs.full-suite.result == 'success' && (needs.infra.result == 'success' || needs.infra.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app_origin }}
    outputs:
      app_origin: ${{ steps.deploy.outputs.app_origin }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The workspace is needed for `prisma migrate deploy`; the builds come from the artifact.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ env.TAG }}
          path: .
      - name: sqlcmd (go-sqlcmd) for the one-time SQL login
        run: |
          if ! command -v sqlcmd >/dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/sqlcmd.tar.bz2" "https://github.com/microsoft/go-sqlcmd/releases/download/$SQLCMD_VERSION/sqlcmd-linux-amd64.tar.bz2"
            tar -xjf "$RUNNER_TEMP/sqlcmd.tar.bz2" -C "$RUNNER_TEMP" sqlcmd
            sudo mv "$RUNNER_TEMP/sqlcmd" /usr/local/bin/sqlcmd
          fi
          sqlcmd --version
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Secrets, migrations, poller, web (infra/deploy.sh)
        id: deploy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          SQL_SERVER_ID: ${{ vars.SQL_SERVER_ID }}
          # Optional country settings; deploy.sh writes each to the web app only when it is set.
          DEFAULT_LOCALE: ${{ vars.DEFAULT_LOCALE }}
          FOOD_SOURCES: ${{ vars.FOOD_SOURCES }}
          OFF_COUNTRY: ${{ vars.OFF_COUNTRY }}
          OFF_CONTRIBUTE_HOST: ${{ vars.OFF_CONTRIBUTE_HOST }}
          APP_VERSION: ${{ env.TAG }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: bash infra/deploy.sh

      - name: Smoke
        env:
          APP_ORIGIN: ${{ steps.deploy.outputs.app_origin }}
        run: |
          for i in $(seq 1 20); do
            BODY=$(curl -fsS "$APP_ORIGIN/api/health" || true)
            if echo "$BODY" | jq -e --arg v "$TAG" '.version == $v and .ok == true' >/dev/null 2>&1; then
              echo "$BODY"; exit 0
            fi
            sleep 15
          done
          echo "::error::$APP_ORIGIN/api/health never reported version $TAG"; exit 1

  publish:
    needs: [verify, deploy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Release notes from the milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## $TAG"
            echo
            echo "Milestone: https://github.com/${{ github.repository }}/milestone/${{ needs.verify.outputs.milestone_number }}"
            echo
            echo "### Closed in this milestone"
            gh issue list --milestone "$TAG" --state closed --limit 200 --json number,title,labels \
              --jq '.[] | "- #\(.number) \(.title)" + (if any(.labels[]; .name=="needs-owner") then " (owner decision)" else "" end)'
            echo
            echo "Frejsi never computes or suggests insulin doses. Every value from an external source or AI stays unverified until a person ticks it."
          } > notes.md
          cat notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
      - name: Close the milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/${{ github.repository }}/milestones/${{ needs.verify.outputs.milestone_number }}" -f state=closed
