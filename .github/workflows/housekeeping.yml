name: housekeeping

# Background triage and cleanup (docs/agent-workflow.md §10). Not part of PR CI and never a required
# check. Twice a day and on demand, Claude Code runs the `housekeeping` skill headless: triage
# untouched issues and PRs with the `triage` agent, merge green Dependabot minors, mark stale PRs,
# delete fully merged branches, fix milestone hygiene, and rewrite the pinned "Waiting on the owner"
# issue. On Mondays it can open one docs-drift PR. It never closes an issue a person opened and
# never touches a lane PR or lane branch.
#
# No `issues: opened` trigger on purpose: the action refuses runs triggered by users without write
# access unless `allowed_non_write_users` is set, which the docs mark as risky (the stranger's text
# becomes the run's input). The schedule reaches every new issue within twelve hours instead.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (subscription), or swap the input for
# `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`. The repo's .claude/settings.json deny list
# (no --admin merges, no force, no tag deletes, no az) applies inside the run.

on:
  schedule:
    - cron: '0 5,17 * * *'   # 07:00 and 19:00 Copenhagen in summer, an hour earlier in winter
  workflow_dispatch:

concurrency:
  group: housekeeping
  cancel-in-progress: false

permissions:
  contents: write        # delete fully merged branches; push the Monday docs-drift branch
  issues: write          # labels, comments, milestones, the owner issue
  pull-requests: write   # labels, stale comments, dependabot auto-merge
  actions: read          # read release.yml results for the owner digest
  id-token: write        # the action's GitHub App auth

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Today
        id: today
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "weekday=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      # Only the Monday docs pass needs the local checks required by /land.
      - uses: pnpm/action-setup@v6
        if: steps.today.outputs.weekday == '1'

      - uses: actions/setup-node@v7
        if: steps.today.outputs.weekday == '1'
        with:
          node-version: 22
          cache: pnpm

      - uses: anthropics/claude-code-action@v1
        # The action mints an installation token and configures both git and gh with it.
        # A workflow GITHUB_TOKEN cannot trigger ci for a newly created drift PR.
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Full output in the run log: the action otherwise hides Claude's messages, and a run that
          # ends after one turn with is_error:true says nothing about why. This repo is public, so
          # the log shows only what the agent could already read on the public repo.
          show_full_output: true
          prompt: >-
            Run the housekeeping skill (.claude/skills/housekeeping/SKILL.md) for nicklasjepsen/frejsi.
            Today is ${{ steps.today.outputs.date }}. This is an unattended run on GitHub Actions:
            nobody can answer questions, so never ask one; when unsure, label needs-owner and move on.
            Write the run summary to $GITHUB_STEP_SUMMARY at the end.
          claude_args: >-
            --max-turns 80
            --allowedTools "Skill,Agent,Read,Write,Edit,Glob,Grep,Bash(gh *),Bash(git fetch*),Bash(git branch*),Bash(git merge-base*),Bash(git tag*),Bash(git log*),Bash(git push origin --delete *),Bash(git status*),Bash(git diff*),Bash(git show*),Bash(git rev-parse*),Bash(git worktree add *),Bash(git add *),Bash(git commit *),Bash(git push -u origin docs/drift-*),Bash(pnpm *),Bash(date*),Bash(cat*),Bash(echo*),Bash(printf*),Bash(jq*),Bash(sort*),Bash(head*),Bash(grep*),Bash(wc*)"
