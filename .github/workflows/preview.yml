name: preview

# Opt-in preview environments (docs/agent-workflow.md section 4, rule 6): add the label `preview` to a
# PR and this workflow deploys the web build to a Static Web App preview environment named after the
# PR, with APP_ORIGIN set to the preview hostname (plan section 7). Removing the label or closing
# the PR deletes the environment. Never required, never blocking.
#
# A preview carries no database and no secrets: screens show their empty states. Static Web Apps
# copies the production application settings into a new environment, so the environment is created
# with a static placeholder and its settings are replaced (APP_ORIGIN and the version, nothing else)
# before the PR's build is uploaded; the PR's code never starts with production settings. It needs
# the `preview` environment with a federated credential for
# repo:<owner>/<repo>:environment:preview (infra/README.md, owner step 3).
#
# Two jobs on purpose. `build` runs the PR's code (install scripts, the Next.js build) with nothing
# but read access and no environment; `deploy` holds the OIDC permission and the `preview`
# environment and only moves the artifact. The PR's code never runs in the job that can mint an
# Azure token. The environment's own protection rules (Settings → Environments → preview) are the
# place to restrict who may deploy at all.

on:
  pull_request:
    branches: [main]
    types: [labeled, unlabeled, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: frejsi
  ENVIRONMENT_NAME: pr${{ github.event.pull_request.number }}

jobs:
  build:
    if: >-
      github.event.action != 'closed' && github.event.action != 'unlabeled'
      && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.ENVIRONMENT_NAME }}-${{ github.event.pull_request.head.sha }}
        run: pnpm --filter ./web build

      # The standalone Next.js build; `.next` is a hidden directory.
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ env.ENVIRONMENT_NAME }}-${{ github.event.pull_request.head.sha }}
          include-hidden-files: true
          path: web/.next
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.hostname.outputs.url }}
    steps:
      # The checkout is data for the upload (staticwebapp.config.json, public/, package.json); no
      # install and no build run here.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: preview-${{ env.ENVIRONMENT_NAME }}-${{ github.event.pull_request.head.sha }}
          path: web/.next

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the Static Web App and its deployment token
        id: swa
        run: |
          NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.Web/staticSites --query "[0].name" -o tsv)
          test -n "$NAME" || { echo "::error::no Static Web App in $AZURE_RESOURCE_GROUP; has the first release run?"; exit 1; }
          TOKEN=$(az staticwebapp secrets list -g "$AZURE_RESOURCE_GROUP" -n "$NAME" --query properties.apiKey -o tsv)
          test -n "$TOKEN" || { echo "::error::$NAME has no deployment token"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Does the preview environment exist yet?
        id: exists
        run: |
          if az staticwebapp environment list -g "$AZURE_RESOURCE_GROUP" -n "${{ steps.swa.outputs.name }}" \
               --query "[?buildId=='$ENVIRONMENT_NAME']" -o tsv | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A new environment is born with a copy of the production settings. Create it with one static
      # page that uses none of them, then replace them, then upload the real build.
      - name: Placeholder page for a new environment
        if: steps.exists.outputs.exists == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/placeholder"
          printf '<!doctype html><title>Frejsi preview</title><p>Preview %s is being prepared.</p>\n' "$ENVIRONMENT_NAME" > "$RUNNER_TEMP/placeholder/index.html"
          cp -r "$RUNNER_TEMP/placeholder" ./preview-placeholder
      - name: Create the preview environment (placeholder only)
        if: steps.exists.outputs.exists == 'false'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: preview-placeholder
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          deployment_environment: ${{ env.ENVIRONMENT_NAME }}

      - name: Preview hostname
        id: hostname
        run: |
          HOST=$(az staticwebapp environment list -g "$AZURE_RESOURCE_GROUP" -n "${{ steps.swa.outputs.name }}" \
            --query "[?buildId=='$ENVIRONMENT_NAME'].hostname | [0]" -o tsv)
          test -n "$HOST" || { echo "::error::preview environment $ENVIRONMENT_NAME has no hostname"; exit 1; }
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "url=https://$HOST" >> "$GITHUB_OUTPUT"

      # The PUT replaces the environment's whole settings list: APP_ORIGIN and the version remain,
      # the copied production settings (DATABASE_URL, keys, tokens) do not. Before the upload.
      - name: Replace the preview environment's settings (no database, no secrets)
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.ENVIRONMENT_NAME }}-${{ github.event.pull_request.head.sha }}
        run: |
          SWA_ID=$(az resource show -g "$AZURE_RESOURCE_GROUP" -n "${{ steps.swa.outputs.name }}" --resource-type Microsoft.Web/staticSites --query id -o tsv)
          jq -n --arg origin "https://${{ steps.hostname.outputs.host }}" --arg version "$NEXT_PUBLIC_APP_VERSION" \
            '{ properties: { APP_ORIGIN: $origin, NEXT_PUBLIC_APP_VERSION: $version } }' > settings.json
          az rest --method put --url "https://management.azure.com${SWA_ID}/builds/${ENVIRONMENT_NAME}/config/appsettings?api-version=2024-04-01" \
            --body @settings.json --output none
          # Read back: nothing but the two keys may be there, or the upload does not happen.
          KEYS=$(az rest --method post --url "https://management.azure.com${SWA_ID}/builds/${ENVIRONMENT_NAME}/listAppSettings?api-version=2024-04-01" \
            --query "keys(properties) | sort(@) | join(',', @)" -o tsv)
          if [ "$KEYS" != "APP_ORIGIN,NEXT_PUBLIC_APP_VERSION" ]; then
            echo "::error::preview environment $ENVIRONMENT_NAME still has settings other than APP_ORIGIN and NEXT_PUBLIC_APP_VERSION ($KEYS); not uploading"; exit 1
          fi

      - name: Deploy to the preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: web
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          deployment_environment: ${{ env.ENVIRONMENT_NAME }}

      - name: Comment the preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Preview for ${{ github.event.pull_request.head.sha }}: ${{ steps.hostname.outputs.url }} (no database; remove the \`preview\` label to delete it)"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"

  remove:
    if: >-
      vars.AZURE_CLIENT_ID != ''
      && (github.event.action == 'closed'
        || (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: preview
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete the preview environment if it exists
        run: |
          NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.Web/staticSites --query "[0].name" -o tsv)
          test -n "$NAME" || exit 0
          if az staticwebapp environment list -g "$AZURE_RESOURCE_GROUP" -n "$NAME" --query "[?buildId=='$ENVIRONMENT_NAME']" -o tsv | grep -q .; then
            az staticwebapp environment delete -g "$AZURE_RESOURCE_GROUP" -n "$NAME" --environment-name "$ENVIRONMENT_NAME" --yes
          fi
