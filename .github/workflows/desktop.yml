# The Windows desktop glance (desktop/): tests the core on every change to it, publishes the exe as a
# workflow artifact on main, and as a GitHub release on a `desktop-vX.Y.Z` tag. Separate from ci.yml
# (the web app's required check) and from release.yml (the only path to production): nothing here
# touches Azure.
name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/BgTray.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/BgTray -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FrejsiDesktop-win-x64
          path: desktop/publish/FrejsiDesktop.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/publish/FrejsiDesktop.exe
          generate_release_notes: false
          body: "Frejsi desktop glance for Windows. Download `FrejsiDesktop.exe`; see `desktop/README.md` for setup."
