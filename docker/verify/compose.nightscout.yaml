# Adds a fictional https Nightscout to the stack so source-connect can be exercised over the Compose
# network. Usage and the certificate command are in docker/README.md. FIXTURE_CERTS is a directory
# holding cert.pem and key.pem (made with openssl for the name nightscout.fixture.test); nothing here is a
# secret and nothing here ships in an image.
services:
  nightscout-fixture:
    image: node:22-bookworm-slim
    command: node /fixture/nightscout-fixture.mjs
    networks:
      default:
        # Nightscout URLs must have a dotted host name.
        aliases:
          - nightscout.fixture.test
    volumes:
      - ./verify/nightscout-fixture.mjs:/fixture/nightscout-fixture.mjs:ro
      - ${FIXTURE_CERTS:?directory with cert.pem and key.pem}:/certs:ro
  poller:
    environment:
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - ${FIXTURE_CERTS:?directory with cert.pem and key.pem}:/certs:ro
