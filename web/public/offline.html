<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frejsi</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f1e8;
        color: #2b2622;
        font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
        text-align: center;
      }
      h1 { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 26px; margin: 0 0 8px; }
      p { margin: 0 0 6px; color: #6e6458; font-size: 15px; line-height: 1.45; }
      @media (prefers-color-scheme: dark) {
        body { background: #1f1b17; color: #f1eadf; }
        p { color: #b5aa9a; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ingen forbindelse lige nu</h1>
      <p>Frejsi kan ikke nå nettet. Prøv igen, når du er online igen.</p>
      <p lang="en">No connection right now. Frejsi can't reach the network; try again when you're back online.</p>
    </main>
  </body>
</html>
