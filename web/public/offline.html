<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Frejsi</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f1e8;
        color: #2b2622;
        font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
        text-align: center;
      }
      h1 { font-family: Newsreader, Georgia, serif; font-weight: 600; font-size: 26px; margin: 0 0 8px; }
      p { margin: 0 0 6px; color: #6e6458; font-size: 15px; line-height: 1.45; }
      button {
        margin-top: 14px;
        padding: 10px 18px;
        border: 1px solid currentColor;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1f1b17; color: #f1eadf; }
        p { color: #b5aa9a; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ingen forbindelse lige nu</h1>
      <p>Frejsi kan ikke nå nettet lige nu. Siden åbner af sig selv, så snart der er forbindelse.</p>
      <p lang="en">No connection right now. Frejsi can't reach the network; the page opens by itself as soon as it can.</p>
      <p><button type="button" id="retry">Prøv igen · Try again</button></p>
    </main>
    <script>
      // Served in place of any page the network didn't deliver (public/sw.js), so a reload asks
      // for that page again. Checked every few seconds while visible, and on coming back online.
      (function () {
        // Say that a page had to give way to this one (components/shell/LoadTiming.tsx).
        // Sent now, and again once the site answers: a phone that is truly offline drops the first.
        var report = "/api/diag/load?type=offline&online=" + (navigator.onLine ? 1 : 0);
        var reported = false;
        function sendReport() {
          try {
            return fetch(report, { keepalive: true }).then(function (response) {
              reported = reported || response.ok;
            });
          } catch (e) {
            return Promise.resolve();
          }
        }
        sendReport().catch(function () {});
        var checking = false;
        function retry() {
          if (checking || document.hidden) return;
          checking = true;
          // A probe can hang just like the page did; abort it so the next check still runs.
          var controller = typeof AbortController === "function" ? new AbortController() : null;
          var timer = setTimeout(function () {
            if (controller) controller.abort();
            checking = false;
          }, 8000);
          fetch("/api/health", { cache: "no-store", signal: controller ? controller.signal : undefined })
            .then(function (response) {
              if (!response.ok) return;
              var reload = function () {
                location.reload();
              };
              if (reported) reload();
              else sendReport().then(reload, reload);
            })
            .catch(function () {})
            .then(function () {
              clearTimeout(timer);
              checking = false;
            });
        }
        document.getElementById("retry").addEventListener("click", function () {
          location.reload();
        });
        addEventListener("online", retry);
        document.addEventListener("visibilitychange", retry);
        setInterval(retry, 5000);
      })();
    </script>
  </body>
</html>
